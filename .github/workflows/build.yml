name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pxnudtcqlmyaelfrdyfp.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qDziDAYhF74XSdqSDWfrAA_HDt9XIS_
      - name: Persist pnpm lockfile for Vercel
        run: |
          cat > vercel.json <<'JSON'
          {
            "headers": [
              {
                "source": "/sw.js",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=0, must-revalidate" }
                ]
              }
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock pnpm for Vercel [skip ci]"
            git push
          fi
