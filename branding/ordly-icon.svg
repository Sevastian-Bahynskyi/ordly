<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="904" y2="984" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b86ff"/>
      <stop offset="0.45" stop-color="#7556f2"/>
      <stop offset="1" stop-color="#5433d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="190" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="232" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#dcd1ff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="792" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#dcd1ff"/>
    </linearGradient>
    <linearGradient id="cover" x1="512" y1="300" x2="512" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfc2ff"/>
      <stop offset="1" stop-color="#b7a5fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(1.12) translate(-512 -552)">
  <!-- soft contact shadow -->
  <path d="M236 372 C338 342 438 352 512 404 C586 352 686 342 788 372 V716 C686 692 586 704 512 756 C438 704 338 692 236 716 Z"
        transform="translate(0 38)" fill="#2d1487" opacity="0.32" filter="url(#shadow)"/>

  <!-- cover edge peeking under the pages -->
  <path d="M220 384 C330 352 436 362 512 414 C588 362 694 352 804 384 V736 C694 712 588 724 512 776 C436 724 330 712 220 736 Z"
        fill="url(#cover)"/>

  <!-- pages -->
  <path d="M244 352 C344 322 440 332 504 382 V742 C440 694 344 684 244 706 Z" fill="url(#pageL)"/>
  <path d="M780 352 C680 322 584 332 520 382 V742 C584 694 680 684 780 706 Z" fill="url(#pageR)"/>

  <!-- quiet text lines -->
  <g fill="none" stroke="#bba9f8" stroke-width="16" stroke-linecap="round" opacity="0.6">
    <path d="M304 438 C354 426 402 430 448 450"/>
    <path d="M304 510 C354 498 402 502 448 522"/>
    <path d="M304 582 C354 570 402 574 448 594"/>
    <path d="M720 438 C670 426 622 430 576 450"/>
    <path d="M720 510 C670 498 622 502 576 522"/>
    <path d="M720 582 C670 570 622 574 576 594"/>
  </g>
  </g>
</svg>
